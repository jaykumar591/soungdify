<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Soundify — Music Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.app{display:flex;min-height:100vh;padding-bottom:90px}.sidebar{width:240px;background:#050505;padding:24px 16px;position:fixed;inset:0 auto 90px 0}
.logo{font-size:25px;font-weight:800;margin:0 0 28px 10px}.logo span{color:#1ed760}
.nav button,.playlist button{width:100%;background:none;border:0;color:#aaa;text-align:left;padding:11px 12px;border-radius:7px;font-size:14px;cursor:pointer}.nav button:hover,.playlist button:hover{background:#181818;color:#fff}
.section{color:#777;font-size:11px;text-transform:uppercase;margin:28px 12px 8px}.main{margin-left:240px;width:calc(100% - 240px);padding:20px 28px 30px;background:linear-gradient(#181818,#0b0b0b 360px)}
.top{display:flex;gap:12px;align-items:center;position:sticky;top:0;padding:8px 0 20px;background:linear-gradient(#181818 70%,transparent);z-index:4}
.search{flex:1;max-width:600px;background:#fff;color:#111;border:0;border-radius:30px;padding:14px 20px;outline:0;font-size:14px}.round{border:0;border-radius:50%;background:#222;color:#fff;width:40px;height:40px;cursor:pointer}
h1{font-size:28px;margin:18px 0}.sub{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{background:#151515;border-radius:9px;padding:13px;cursor:pointer;transition:.2s;position:relative}.card:hover{background:#222;transform:translateY(-2px)}
.cover{width:100%;aspect-ratio:1;border-radius:7px;object-fit:cover;background:#292929}.title{font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#999;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.likemini{position:absolute;left:17px;bottom:62px;border:0;border-radius:50%;width:36px;height:36px;background:#242424;color:#1ed760;font-size:20px;cursor:pointer}.retry{border:0;border-radius:22px;background:#1ed760;color:#000;padding:11px 20px;font-weight:700;cursor:pointer}.errorbox{max-width:720px;margin:30px auto;background:#171717;border-radius:12px;padding:35px;line-height:1.5}.errorbox p{overflow-wrap:anywhere;color:#aaa}.playmini{position:absolute;right:17px;bottom:62px;border:0;border-radius:50%;width:44px;height:44px;background:#1ed760;color:#000;font-size:18px;cursor:pointer;box-shadow:0 5px 18px #0008}
.player{height:90px;position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #292929;display:grid;grid-template-columns:280px 1fr 280px;align-items:center;padding:10px 18px;z-index:10}
.now{display:flex;gap:12px;align-items:center;min-width:0}.now img{width:58px;height:58px;border-radius:5px;object-fit:cover}.now div{min-width:0}.now b,.now span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now span{color:#aaa;font-size:12px;margin-top:5px}
.controls{text-align:center}.buttons{display:flex;justify-content:center;align-items:center;gap:18px}.buttons button{background:none;border:0;color:#fff;font-size:17px;cursor:pointer}.buttons .play{background:#fff;color:#000;border-radius:50%;width:38px;height:38px}.progress{display:flex;gap:8px;align-items:center;font-size:10px;color:#888}.bar{height:4px;background:#555;border-radius:5px;flex:1;cursor:pointer}.fill{height:100%;background:#fff;width:0;border-radius:5px}.right{display:flex;justify-content:flex-end;gap:12px;align-items:center}.vol{width:100px}
.toast{position:fixed;right:20px;bottom:110px;background:#222;padding:12px 16px;border-radius:8px;display:none;z-index:20}
.empty{padding:50px;text-align:center;color:#888}.loader{text-align:center;padding:30px;color:#aaa}
@media(max-width:800px){.sidebar{width:70px;padding:20px 8px}.logo{font-size:0}.logo span{font-size:22px}.nav button,.playlist button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:15px}.player{grid-template-columns:1fr 1fr}.right{display:none}.now{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Sound<span>ify</span></div>
  <div class="nav">
    <button onclick="home()">⌂ &nbsp; Home</button>
    <button onclick="loadTrending()">◉ &nbsp; Trending</button>
    <button onclick="focusSearch()">⌕ &nbsp; Search</button>
  </div>
  <div class="section">Your Library</div>
  <div class="playlist">
    <button onclick="showLiked()">♥ &nbsp; Liked Songs</button>
    <button onclick="showQueue()">☷ &nbsp; Queue</button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <button class="round" onclick="history.back()">‹</button>
    <button class="round" onclick="history.forward()">›</button>
    <input id="search" class="search" placeholder="What do you want to play?" onkeydown="if(event.key==='Enter')searchSongs()">
  </div>
  <section id="content">
    <h1>Good music. No limits.</h1>
    <p class="sub">Powered by Audius. Search and play available tracks.</p>
    <h1>Trending</h1>
    <div id="songs" class="grid"><div class="loader">Loading music…</div></div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<footer class="player">
  <div class="now">
    <img id="nowImg" src="" alt="">
    <div><b id="nowTitle">Nothing playing</b><span id="nowArtist">Choose a song</span></div>
  </div>
  <div class="controls">
    <div class="buttons">
      <button onclick="prevSong()">⏮</button>
      <button onclick="toggleShuffle()" id="shuffle">🔀</button>
      <button class="play" onclick="togglePlay()" id="play">▶</button>
      <button onclick="toggleRepeat()" id="repeat">🔁</button>
      <button onclick="nextSong()">⏭</button>
    </div>
    <div class="progress"><span id="cur">0:00</span><div class="bar" onclick="seek(event)"><div class="fill" id="fill"></div></div><span id="dur">0:00</span></div>
  </div>
  <div class="right">🔊 <input class="vol" id="volume" type="range" min="0" max="1" step=".01" value=".8"></div>
</footer>
<audio id="audio" preload="metadata"></audio>

<script>
// Audius discovery provider is the primary public read endpoint; api.audius.co is a fallback.
const API_HOSTS=["https://discoveryprovider.audius.co/v1","https://api.audius.co/v1"];
const APP_NAME="soundify_web_player";
let activeApiHost=localStorage.getItem("soundify_api_host")||API_HOSTS[0];
let songs=[], index=-1, queue=[], liked=JSON.parse(localStorage.getItem("liked")||"[]");
let shuffle=false, repeat=false;
const audio=document.getElementById("audio"), $=id=>document.getElementById(id);

function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$ ("toast").style.display="none",2600)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function img(t){return t.artwork?.['480x480']||t.artwork?.['150x150']||t.artwork?.['1000x1000']||"https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=600&q=80"}
function render(list,title="Songs"){
 songs=list||[]; $("content").innerHTML=`<h1>${esc(title)}</h1><div id="songs" class="grid"></div>`;
 const box=$("songs");
 if(!songs.length){box.innerHTML='<div class="empty">No songs found. Try another search.</div>';return}
 songs.forEach((s,i)=>{
  const isLiked=liked.some(x=>String(x.id)===String(s.id));
  box.insertAdjacentHTML("beforeend",`<article class="card" onclick="playAt(${i})">
    <img class="cover" src="${img(s)}" alt="Cover art" onerror="this.style.opacity=.3">
    <button class="playmini" title="Play" onclick="event.stopPropagation();playAt(${i})">▶</button>
    <button class="likemini" title="${isLiked?'Remove from':'Add to'} Liked Songs" onclick="event.stopPropagation();toggleLike(${i})">${isLiked?'♥':'♡'}</button>
    <div class="title">${esc(s.title||"Untitled")}</div>
    <div class="artist">${esc(s.user?.name||"Unknown artist")}</div>
  </article>`)
 })
}
async function api(path){
 const errors=[];
 // Try the currently successful host first, then the alternate Audius host.
 const hosts=[activeApiHost,...API_HOSTS.filter(h=>h!==activeApiHost)];
 for(const host of hosts){
  const sep=path.includes('?')?'&':'?';
  const url=host+path+sep+'app_name='+encodeURIComponent(APP_NAME);
  try{
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),12000);
   const r=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},signal:controller.signal});
   clearTimeout(timeout);
   if(!r.ok){
    const detail=await r.text().catch(()=>"");
    throw new Error(`HTTP ${r.status}${detail?': '+detail.slice(0,100):''}`);
   }
   const payload=await r.json();
   if(payload?.data===undefined)throw new Error(payload?.error||'Unexpected API response');
   activeApiHost=host;
   localStorage.setItem('soundify_api_host',host);
   return payload.data;
  }catch(err){errors.push(host.replace('https://','')+': '+(err.name==='AbortError'?'request timed out':err.message));}
 }
 throw new Error(errors.join(' | '));
}
function showLoadError(err,where){
 const msg=String(err?.message||err||'Unknown error');
 $("content").innerHTML=`<h1>${esc(where||'Music unavailable')}</h1>
 <div class="empty errorbox"><div style="font-size:42px;margin-bottom:12px">⚠️</div>
 <b>Could not connect to Audius.</b><p>${esc(msg)}</p>
 <p>Check your connection, disable VPN/ad-blocking temporarily, or open this file through a local web server (for example VS Code Live Server).</p>
 <button class="retry" onclick="loadTrending()">Retry</button></div>`;
}
async function loadTrending(){
 $("content").innerHTML='<h1>Trending now</h1><div class="loader">Connecting to Audius…</div>';
 try{render(await api('/tracks/trending?limit=24'),'Trending now')}
 catch(e){showLoadError(e,'Trending now')}
}
async function searchSongs(){
 const q=$("search").value.trim();if(!q)return;
 $("content").innerHTML='<div class="loader">Searching Audius…</div>';
 try{render(await api('/tracks/search?query='+encodeURIComponent(q)+'&limit=30'),'Search results')}
 catch(e){showLoadError(e,'Search failed')}
}
function focusSearch(){$("search").focus()}
function playAt(i){
 if(!songs[i])return;
 queue=songs.slice();index=i;loadCurrent();
}
let streamCandidates=API_HOSTS.slice(),streamCandidateIndex=0;
function setStreamSource(track){
 const host=streamCandidates[streamCandidateIndex];
 audio.src=host+"/tracks/"+encodeURIComponent(track.id)+"/stream?app_name="+encodeURIComponent(APP_NAME);
 audio.load();
}
function loadCurrent(){
 const s=queue[index];if(!s)return;
 $("nowImg").src=img(s);$("nowTitle").textContent=s.title||"Untitled";$("nowArtist").textContent=s.user?.name||"Unknown artist";
 streamCandidates=[activeApiHost,...API_HOSTS.filter(h=>h!==activeApiHost)];
 streamCandidateIndex=0;
 setStreamSource(s);
 audio.play().catch(()=>toast("Tap Play to start. If it fails, try another track."));
 $("play").textContent="❚❚";toast("Playing: "+(s.title||"Untitled"));
}
function togglePlay(){if(!audio.src){toast("Select a song first");return}audio.paused?(audio.play(),$("play").textContent="❚❚"):(audio.pause(),$("play").textContent="▶")}
function nextSong(){
 if(!queue.length)return;
 if(shuffle) index=Math.floor(Math.random()*queue.length);
 else index=(index+1)%queue.length;
 loadCurrent();
}
function prevSong(){if(audio.currentTime>4){audio.currentTime=0;return}if(!queue.length)return;index=(index-1+queue.length)%queue.length;loadCurrent()}
function toggleShuffle(){shuffle=!shuffle;$("shuffle").style.opacity=shuffle?1:.45;toast(shuffle?"Shuffle on":"Shuffle off")}
function toggleRepeat(){repeat=!repeat;$("repeat").style.opacity=repeat?1:.45;toast(repeat?"Repeat on":"Repeat off")}
audio.addEventListener("ended",()=>repeat?loadCurrent():nextSong());
audio.addEventListener("error",()=>{
 if(index>=0 && streamCandidateIndex+1<streamCandidates.length){
  streamCandidateIndex++;
  setStreamSource(queue[index]);
  audio.play().catch(()=>toast("This track could not be played on the alternate server."));
 }else if(index>=0){toast("Unable to stream this track. Try another song.");}
});
audio.addEventListener("timeupdate",()=>{
 $("cur").textContent=fmt(audio.currentTime);$("dur").textContent=fmt(audio.duration||0);
 $("fill").style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%";
});
audio.addEventListener("play",()=>$("play").textContent="❚❚");
audio.addEventListener("pause",()=>$("play").textContent="▶");
$("volume").oninput=e=>audio.volume=e.target.value;
function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function seek(e){if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}
function home(){loadTrending()}
function toggleLike(i){
 const track=songs[i];if(!track)return;
 const id=String(track.id);
 const exists=liked.some(x=>String(x.id)===id);
 liked=exists?liked.filter(x=>String(x.id)!==id):[track,...liked];
 localStorage.setItem('liked',JSON.stringify(liked));
 const title=exists?'Removed from Liked Songs':'Added to Liked Songs';toast(title);
 const heading=$("content").querySelector('h1')?.textContent||'Songs';render(songs,heading);
}
function showLiked(){render(liked,"Liked Songs")}
function showQueue(){render(queue,"Queue")}
loadTrending();
</script>
</body>
</html>
